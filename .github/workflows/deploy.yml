name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (supports custom domain via public/CNAME)
        run: |
          REPO_NAME=${GITHUB_REPOSITORY#*/}
          if [ -f public/CNAME ]; then
            echo "Detected public/CNAME. Building with base '/' and copying CNAME."
            npm run build -- --base=/
            cp public/CNAME dist/CNAME
          else
            echo "No CNAME found. Building with base '/$REPO_NAME/'"
            npm run build -- --base=/$REPO_NAME/
          fi
          cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
